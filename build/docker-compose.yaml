services:
  dyndns-bridge:
    container_name: 'miniauth-server'
    image: 'ghcr.io/phkiener/miniauth-server:0.1.0'
    restart: unless-stopped
    ports:
      - 15151:15151
    volumes:
      - ./path/to/miniauth-check:/bin/miniauth-check # mount the miniauth-check executable into the container
    environment:
      - DOTNET_URLS=http://*:15151 # make sure this matches the exposed port
      - MINIAUTH_DOMAIN=my-domain.com # this should be your own domain; the session cookie will be applied to all subdomains
      - MINIAUTH_SESSIONLIFETIMEDAYS=7 # how many days a session should be valid for
      - MINIAUTH_EXECUTABLE=/bin/miniauth-check
